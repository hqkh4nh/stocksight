# StockSight — Configuration File

data:
  start_date: "2015-01-01"
  cache_dir: "data"

tickers:
  - AAPL    # Apple - Tech
  - MSFT    # Microsoft - Tech
  - NVDA    # NVIDIA - Tech
  - AMZN    # Amazon - E-commerce
  - TSLA    # Tesla - Auto
  - JPM     # JPMorgan - Finance
  - KO      # Coca-Cola - Consumer
  - JNJ     # Johnson & Johnson - Healthcare

# Train/test split
split:
  train_ratio: 0.80

# Hyperparameters
ml:
  ridge:
    alpha: 1.0
  logistic:
    max_iter: 1000
    class_weight: "balanced"
  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

# Paths
paths:
  models_dir: "models"
  results_dir: "results"